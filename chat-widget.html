<!-- Jamaica House Brand - Mobile-First Chat Widget -->
<!-- Add this viewport tag to your <head> section if not already present: -->
<!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->

<div id="jhb-chat-widget" class="jhb-chat-widget">
  <div class="jhb-chat-header">
    <div class="jhb-chat-avatar">🥘</div>
    <div class="jhb-chat-header-text">
      <h3>Chef's Chat</h3>
      <p>Ask about our products</p>
    </div>
    <button class="jhb-chat-close" onclick="toggleJHBChat()" aria-label="Close chat">×</button>
  </div>
  <div class="jhb-chat-body">
    <div class="jhb-chat-messages" id="jhbMessages">
      <div class="jhb-message bot">
        <p>Hey there! 🔥 What would you like to know about our authentic Jamaican jerk sauce?</p>
      </div>
    </div>
  </div>
  <div class="jhb-chat-input">
    <input
      type="text"
      id="jhbInput"
      placeholder="Ask us anything..."
      onkeypress="handleJHBEnter(event)"
      autocomplete="off"
    >
    <button onclick="sendJHBMessage()" class="jhb-send-btn" aria-label="Send message">
      <span>→</span>
    </button>
  </div>
</div>

<button class="jhb-chat-toggle" onclick="toggleJHBChat()" aria-label="Open chat">
  <span>💬</span>
</button>

<style>
/* Jamaica House Brand - Mobile-First Responsive Chat */

/* Mobile-First Base Styles (320px and up) */
.jhb-chat-widget {
  position: fixed;
  bottom: 70px;
  right: 12px;
  width: calc(100vw - 24px);
  max-width: 320px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  display: none;
  flex-direction: column;
  max-height: 450px;
  z-index: 9999;
  border: 2px solid #C4A961;
}

.jhb-chat-widget.active {
  display: flex;
}

.jhb-chat-header {
  background: linear-gradient(135deg, #2D2D2D 0%, #1A1A1A 100%);
  color: #C4A961;
  padding: 12px;
  border-radius: 12px 12px 0 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.jhb-chat-avatar {
  font-size: 28px;
  min-width: 36px;
  flex-shrink: 0;
}

.jhb-chat-header-text {
  flex: 1;
  min-width: 0;
}

.jhb-chat-header h3 {
  margin: 0;
  font-size: 14px;
  color: #C4A961;
  font-weight: 600;
}

.jhb-chat-header p {
  margin: 2px 0 0 0;
  font-size: 11px;
  color: #999;
}

.jhb-chat-close {
  background: none;
  border: none;
  color: #C4A961;
  font-size: 28px;
  cursor: pointer;
  padding: 0;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}

.jhb-chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  -webkit-overflow-scrolling: touch;
}

.jhb-chat-messages {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.jhb-message {
  padding: 10px 12px;
  border-radius: 10px;
  max-width: 85%;
  word-wrap: break-word;
  font-size: 13px;
  line-height: 1.4;
}

.jhb-message.bot {
  background: #F5F5F5;
  border-left: 3px solid #C4A961;
  align-self: flex-start;
  color: #333;
}

.jhb-message.user {
  background: #C4A961;
  color: white;
  align-self: flex-end;
}

.jhb-chat-input {
  display: flex;
  gap: 6px;
  padding: 10px;
  border-top: 1px solid #E5E5E5;
  background: white;
}

.jhb-chat-input input {
  flex: 1;
  border: 1px solid #DDD;
  border-radius: 6px;
  padding: 10px;
  font-family: inherit;
  font-size: 14px;
  min-height: 44px;
}

.jhb-chat-input input:focus {
  outline: none;
  border-color: #C4A961;
}

.jhb-send-btn {
  background: #C4A961;
  color: #1A1A1A;
  border: none;
  border-radius: 6px;
  width: 44px;
  height: 44px;
  cursor: pointer;
  font-size: 18px;
  font-weight: bold;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

.jhb-send-btn:active {
  background: #D4B971;
}

.jhb-chat-toggle {
  position: fixed;
  bottom: 16px;
  right: 12px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #C4A961;
  border: none;
  cursor: pointer;
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 15px rgba(196, 169, 97, 0.4);
  z-index: 9998;
  -webkit-tap-highlight-color: transparent;
}

.jhb-chat-toggle:active {
  background: #D4B971;
  box-shadow: 0 6px 20px rgba(196, 169, 97, 0.6);
}

.jhb-chat-widget.active ~ .jhb-chat-toggle {
  display: none;
}

/* Tablet Breakpoint (768px and up) */
@media (min-width: 768px) {
  .jhb-chat-widget {
    bottom: 80px;
    right: 20px;
    width: 360px;
    max-height: 500px;
  }

  .jhb-chat-header {
    padding: 16px;
    gap: 12px;
  }

  .jhb-chat-avatar {
    font-size: 32px;
    min-width: 40px;
  }

  .jhb-chat-header h3 {
    font-size: 16px;
  }

  .jhb-chat-header p {
    font-size: 12px;
  }

  .jhb-chat-body {
    padding: 16px;
  }

  .jhb-message {
    padding: 12px 16px;
    font-size: 14px;
    max-width: 85%;
  }

  .jhb-chat-input {
    gap: 8px;
    padding: 12px;
  }

  .jhb-chat-input input {
    padding: 10px 12px;
    font-size: 14px;
  }

  .jhb-send-btn {
    width: 40px;
    height: 40px;
    font-size: 18px;
  }

  .jhb-chat-toggle {
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    font-size: 28px;
  }
}

/* Desktop Breakpoint (1024px and up) */
@media (min-width: 1024px) {
  .jhb-chat-widget {
    width: 380px;
    max-height: 550px;
  }
}
</style>

<script>
function toggleJHBChat() {
  const widget = document.getElementById('jhb-chat-widget');
  widget.classList.toggle('active');

  // Focus input when opened
  if (widget.classList.contains('active')) {
    setTimeout(() => {
      document.getElementById('jhbInput').focus();
    }, 100);
  }
}

function sendJHBMessage() {
  const input = document.getElementById('jhbInput');
  const text = input.value.trim();

  if (!text) return;

  const messagesDiv = document.getElementById('jhbMessages');
  const userMsg = document.createElement('div');
  userMsg.className = 'jhb-message user';
  userMsg.textContent = text;
  messagesDiv.appendChild(userMsg);

  input.value = '';
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  // Simulate bot response
  setTimeout(() => {
    const botMsg = document.createElement('div');
    botMsg.className = 'jhb-message bot';
    botMsg.textContent = 'Thanks for your question! Our team will get back to you shortly.';
    messagesDiv.appendChild(botMsg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }, 500);
}

function handleJHBEnter(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    sendJHBMessage();
  }
}
</script>
